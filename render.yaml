services:
  - type: web
    name: shabdle
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: shabdle-db
          property: connectionString

databases:
  - name: shabdle-db
    databaseName: shabdle
    user: shabdle
    region: oregon
    plan: free
