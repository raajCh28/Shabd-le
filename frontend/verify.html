<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verify your email - Shabdle</title>
    <link rel="stylesheet" href="/static/styles.css?v=3" />
  </head>
  <body class="auth-page">
    <header class="topbar">
      <a class="brand" href="/">SH<strong>ABDLE</strong></a>
    </header>
    <main class="auth-card" id="verification-card">
      <p class="eyebrow">One quick step</p>
      <h1>Verify your email</h1>
      <p class="muted">Enter the six-digit code we emailed you. It expires in 10 minutes.</p>
      <form id="verify-form">
        <label>
          Email
          <input id="verification-email" type="email" autocomplete="email" required />
        </label>
        <label>
          Six-digit code
          <input
            id="verification-code"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            pattern="[0-9]{6}"
            maxlength="6"
            required
          />
        </label>
        <button class="button primary-button" type="submit">Verify email <span>→</span></button>
      </form>
      <button class="button" id="resend-code" type="button">Send a new code</button>
    </main>
    <div id="toast" class="toast" role="status"></div>
    <script src="/static/auth.js"></script>
    <script>initEmailVerification();</script>
  </body>
</html>
