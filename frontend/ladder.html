<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ladder - Shabdle</title>
    <link rel="stylesheet" href="/static/styles.css?v=12" />
    <link rel="stylesheet" href="/static/ladder.css?v=4" />
    <link rel="stylesheet" href="/static/game-feedback.css?v=7" />
  </head>
  <body class="compact-game-page">
    <header class="topbar">
      <a class="brand" href="/">SH<strong>ABDLE</strong></a>
      <nav id="nav"></nav>
    </header>
    <main class="game-shell ladder-shell">
      <p class="eyebrow">The Ladder</p>
      <h1 class="game-mode-title">CLIMB THE LADDER</h1>
      <p class="muted" id="game-subtitle">
        Solve each word to climb from 5 letters to 20. Six guesses per step; a miss sends you back to five.
      </p>
      <div class="game-legend" aria-label="Tile colors">
        <span><i class="legend-tile correct"></i> Right place</span>
        <span><i class="legend-tile present"></i> In the word</span>
        <span><i class="legend-tile absent"></i> Not in word</span>
      </div>
      <section class="ladder-status" id="ladder-status" aria-live="polite"><span>Loading your climb…</span></section>
      <div class="board ladder-board" id="board"></div>
      <div id="keyboard" class="keyboard"></div>
      <p id="game-message" class="game-message" aria-live="polite"></p>
    </main>
    <div id="toast" class="toast" role="status"></div>
    <script src="/static/common.js?v=3"></script>
    <script src="/static/game-feedback.js?v=7"></script>
    <script src="/static/ladder.js?v=16" defer></script>
  </body>
</html>
