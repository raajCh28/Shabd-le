<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121116" />
    <meta name="description" content="Shabdle: a daily word puzzle, endless rounds, a 5-to-20-letter ladder, and custom words to share." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23c4a7ff%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2720%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27%23121116%27 font-family=%27sans-serif%27%3ES%3C/text%3E%3C/svg%3E" />
    <title>Create account - Shabdle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="auth-page">
    <noscript><p style="padding:16px;text-align:center">Shabdle needs JavaScript to run.</p></noscript>
    <header class="topbar">
      <a class="brand" href="/">SH<strong>ABDLE</strong></a>
    </header>
    <main class="auth-card">
      <p class="eyebrow">Start your streak</p>
      <h1>Create account</h1>
      <p class="muted">Create an account and start playing right away. Email verification is off.</p>
      <form id="auth-form">
        <label>Username<input id="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" autocomplete="username" required /><small>3–24 letters, numbers, or underscores</small></label>
        <label>
          Email
          <input id="email" type="email" autocomplete="email" required />
        </label>
        <label>
          Password
          <input
            id="password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
          />
          <small>At least 8 characters</small>
        </label>
        <button class="button primary-button" type="submit">
          Create account <span>→</span>
        </button>
      </form>
      <p class="auth-foot">
        Already have an account? <a href="/login.html">Log in</a>
      </p>
    </main>
    <div id="toast" class="toast" role="status"></div>
    <script src="/static/common.js"></script>
    <script src="/static/auth.js"></script>
    <script>initAuth("register");</script>
  </body>
</html>
