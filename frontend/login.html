<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121116" />
    <meta name="description" content="Shabdle: a daily word puzzle, endless rounds, a 5-to-20-letter ladder, and custom words to share." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23c4a7ff%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2720%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27%23121116%27 font-family=%27sans-serif%27%3ES%3C/text%3E%3C/svg%3E" />
    <title>Log in - Shabdle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="auth-page">
    <noscript><p style="padding:16px;text-align:center">Shabdle needs JavaScript to run.</p></noscript>
    <header class="topbar">
      <a class="brand" href="/">SH<strong>ABDLE</strong></a>
    </header>
    <main class="auth-card">
      <p class="eyebrow">Welcome back</p>
      <h1>Log in</h1>
      <p class="muted">Your daily word is waiting.</p>
      <form id="auth-form">
        <label>
          Username
          <input id="username" autocomplete="username" required />
        </label>
        <label>
          Password
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </label>
        <button class="button primary-button" type="submit">
          Log in <span>→</span>
        </button>
      </form>
      <p class="auth-foot muted">Password reset isn’t available. Keep your password somewhere safe.</p>
      <p class="auth-foot">
        New here? <a href="/register.html">Create an account</a>
      </p>
    </main>
    <div id="toast" class="toast" role="status"></div>
    <script src="/static/common.js"></script>
    <script src="/static/auth.js"></script>
    <script>initAuth("login");</script>
  </body>
</html>
