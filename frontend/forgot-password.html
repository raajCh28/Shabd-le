<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Reset password - Shabdle</title><link rel="stylesheet" href="/static/styles.css?v=3" /></head>
  <body class="auth-page">
    <header class="topbar"><a class="brand" href="/">SH<strong>ABDLE</strong></a></header>
    <main class="auth-card">
      <p class="eyebrow">Account recovery</p><h1>Reset password</h1>
      <p class="muted">We’ll email a six-digit code to your account address. Check Spam too. Verifying this code will also verify an unverified account.</p>
      <form id="reset-form">
        <label>Email<input id="reset-email" type="email" autocomplete="email" required /></label>
        <div id="reset-code-fields" hidden>
          <label>Verification code<input id="reset-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" /></label>
          <label>New password<input id="new-password" type="password" minlength="8" autocomplete="new-password" /></label>
        </div>
        <button id="reset-submit" class="button primary-button" type="submit">Send code <span>→</span></button>
      </form>
      <p class="auth-foot"><a href="/login.html">Back to log in</a></p>
    </main>
    <div id="toast" class="toast" role="status"></div>
    <script src="/static/auth.js"></script><script>initPasswordReset();</script>
  </body>
</html>
