<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily - Shabdle</title>
    <link rel="stylesheet" href="/static/styles.css?v=12" />
    <link rel="stylesheet" href="/static/game-feedback.css?v=7" />
  </head>
  <body class="compact-game-page">
    <header class="topbar">
      <a class="brand" href="/">SH<strong>ABDLE</strong></a>
      <nav id="nav"></nav>
    </header>
    <main class="game-shell">
      <p class="eyebrow">The daily</p>
      <h1>One word. All of us.</h1>
      <p class="muted" id="game-subtitle">
        A fresh five-letter puzzle every day.
      </p>
      <div class="game-legend" aria-label="Tile colors">
        <span><i class="legend-tile correct"></i> Right place</span>
        <span><i class="legend-tile present"></i> In the word</span>
        <span><i class="legend-tile absent"></i> Not in word</span>
      </div>
      <p id="answer-reveal" class="answer-reveal" aria-live="polite" hidden></p>
      <div class="board" id="board"></div>
      <div id="keyboard" class="keyboard"></div>
      <p id="game-message" class="game-message" aria-live="polite"></p>
    </main>
    <div id="toast" class="toast" role="status"></div>
    <script src="/static/common.js?v=4"></script>
    <script src="/static/game-feedback.js?v=6"></script>
    <script src="/static/game-engine.js?v=19"></script>
    <script src="/static/daily.js"></script>
  </body>
</html>
